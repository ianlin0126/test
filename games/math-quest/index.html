<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quest 🚀</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    .screen {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      animation: fadeIn 0.3s ease;
    }
    h1 {
      font-size: clamp(36px, 9vw, 56px);
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .subtitle {
      font-size: clamp(20px, 4.5vw, 26px);
      text-align: center;
      opacity: 0.95;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 16px 24px;
      font-size: 28px;
      font-weight: 700;
      font-family: inherit;
      color: #4b3a8a;
      background: #fff;
      border: none;
      border-radius: 20px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 8px 16px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn:hover, .btn:focus-visible {
      outline: 4px solid #ffe66d;
      outline-offset: 2px;
    }
    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 4px 8px rgba(0,0,0,0.2);
    }
    .btn .emoji { font-size: 36px; line-height: 1; }
    .btn-secondary {
      background: rgba(255,255,255,0.22);
      color: #fff;
      box-shadow: 0 4px 0 rgba(0,0,0,0.18);
      min-height: 60px;
      font-size: 22px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      gap: 12px;
    }
    .progress { font-size: 20px; font-weight: 600; }
    .stars { font-size: 22px; font-weight: 700; }
    .home-btn {
      background: rgba(255,255,255,0.22);
      color: #fff;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      font-size: 26px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .home-btn:hover, .home-btn:focus-visible {
      background: rgba(255,255,255,0.35);
      outline: 3px solid #ffe66d;
    }

    .equation {
      font-size: clamp(56px, 15vw, 96px);
      font-weight: 800;
      text-align: center;
      padding: 28px 16px;
      background: rgba(255,255,255,0.18);
      border-radius: 24px;
      width: 100%;
      letter-spacing: 0.04em;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }
    .choice {
      min-height: 92px;
      font-size: 38px;
      font-weight: 800;
      color: #4b3a8a;
      background: #fff;
      border: none;
      border-radius: 18px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.18);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s, box-shadow 0.1s;
      font-family: inherit;
    }
    .choice:hover:not(:disabled), .choice:focus-visible {
      outline: 4px solid #ffe66d;
      outline-offset: 2px;
    }
    .choice:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 3px 0 rgba(0,0,0,0.18);
    }
    .choice.correct {
      background: #6ee7b7;
      animation: pop 0.35s ease;
    }
    .choice.wrong {
      background: #fca5a5;
      animation: shake 0.4s;
    }
    .choice:disabled { cursor: default; }

    .feedback {
      font-size: 28px;
      font-weight: 700;
      min-height: 40px;
      text-align: center;
    }

    .result-stars {
      font-size: 72px;
      letter-spacing: 6px;
      text-align: center;
      animation: pop 0.5s ease;
    }
    .result-message {
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 800;
      text-align: center;
    }
    .result-score {
      font-size: 24px;
      text-align: center;
      opacity: 0.92;
    }

    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
    (function () {
      const QUESTIONS_PER_ROUND = 10;
      const app = document.getElementById('app');

      const state = {
        mode: null,
        questions: [],
        currentIdx: 0,
        correct: 0,
        answered: false,
      };

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function makeMultQuestion() {
        const a = randInt(2, 10);
        const b = randInt(2, 10);
        return { text: a + ' × ' + b, answer: a * b };
      }

      function makeDivQuestion() {
        const divisor = randInt(2, 10);
        const quotient = randInt(2, 10);
        return { text: (divisor * quotient) + ' ÷ ' + divisor, answer: quotient };
      }

      function makeChoices(answer) {
        const pool = new Set();
        let attempts = 0;
        while (pool.size < 3 && attempts < 60) {
          attempts++;
          const offset = randInt(-5, 5);
          if (offset === 0) continue;
          const candidate = answer + offset;
          if (candidate >= 0 && candidate !== answer) pool.add(candidate);
        }
        // Backfill if pool came up short (only happens for tiny answers)
        let pad = answer + 6;
        while (pool.size < 3) { pool.add(pad++); }
        const choices = [...pool, answer];
        for (let i = choices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [choices[i], choices[j]] = [choices[j], choices[i]];
        }
        return choices;
      }

      function generateQuestions(mode) {
        const qs = [];
        for (let i = 0; i < QUESTIONS_PER_ROUND; i++) {
          let q;
          if (mode === 'mult') q = makeMultQuestion();
          else if (mode === 'div') q = makeDivQuestion();
          else q = Math.random() < 0.5 ? makeMultQuestion() : makeDivQuestion();
          q.choices = makeChoices(q.answer);
          qs.push(q);
        }
        return qs;
      }

      function el(tag, props, kids) {
        const e = document.createElement(tag);
        if (props) {
          for (const k in props) {
            const v = props[k];
            if (k === 'class') e.className = v;
            else if (k === 'aria') {
              for (const ak in v) e.setAttribute('aria-' + ak, v[ak]);
            } else if (k.startsWith('on')) {
              e.addEventListener(k.slice(2), v);
            } else {
              e.setAttribute(k, v);
            }
          }
        }
        if (kids != null) {
          (Array.isArray(kids) ? kids : [kids]).forEach(c => {
            if (c == null) return;
            e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
          });
        }
        return e;
      }

      function clear() { app.textContent = ''; }

      function showStart() {
        clear();
        const screen = el('div', { class: 'screen' }, [
          el('h1', null, 'Math Quest 🚀'),
          el('p', { class: 'subtitle' }, 'Pick a game!'),
          el('button', {
            class: 'btn',
            onclick: function () { startRound('mult'); },
            aria: { label: 'Multiplication practice' },
          }, [
            el('span', { class: 'emoji' }, '✖️'),
            el('span', null, 'Multiplication'),
          ]),
          el('button', {
            class: 'btn',
            onclick: function () { startRound('div'); },
            aria: { label: 'Division practice' },
          }, [
            el('span', { class: 'emoji' }, '➗'),
            el('span', null, 'Division'),
          ]),
          el('button', {
            class: 'btn',
            onclick: function () { startRound('both'); },
            aria: { label: 'Mixed multiplication and division' },
          }, [
            el('span', { class: 'emoji' }, '🎯'),
            el('span', null, 'Mixed Mode'),
          ]),
        ]);
        app.appendChild(screen);
      }

      function startRound(mode) {
        state.mode = mode;
        state.questions = generateQuestions(mode);
        state.currentIdx = 0;
        state.correct = 0;
        showQuestion();
      }

      function showQuestion() {
        clear();
        state.answered = false;
        const q = state.questions[state.currentIdx];

        const choicesGrid = el('div', { class: 'choices' });
        const choiceButtons = [];
        q.choices.forEach(function (c) {
          const btn = el('button', {
            class: 'choice',
            aria: { label: 'Answer ' + c },
          }, String(c));
          btn.addEventListener('click', function () {
            onAnswer(btn, c, q.answer, choiceButtons);
          });
          choiceButtons.push(btn);
          choicesGrid.appendChild(btn);
        });

        const feedback = el('div', { class: 'feedback', id: 'feedback' });

        const screen = el('div', { class: 'screen' }, [
          el('div', { class: 'header-row' }, [
            el('button', {
              class: 'home-btn',
              onclick: showStart,
              aria: { label: 'Back to menu' },
            }, '🏠'),
            el('div', { class: 'progress' },
              'Question ' + (state.currentIdx + 1) + ' of ' + QUESTIONS_PER_ROUND),
            el('div', {
              class: 'stars',
              aria: { label: state.correct + ' correct so far' },
            }, '⭐ ' + state.correct),
          ]),
          el('div', { class: 'equation' }, q.text + ' = ?'),
          choicesGrid,
          feedback,
        ]);
        app.appendChild(screen);
      }

      const RIGHT_MESSAGES = ['Awesome! 🎉', 'Great job! ⭐', 'Yes! 🌟', 'You got it! 💫', 'Nice work! 🚀', 'Wow! ✨'];
      const TRY_AGAIN_MESSAGES = ['Try again! 💪', 'Almost! 🌱', 'Keep going! 💫'];

      function onAnswer(btn, choice, answer, allButtons) {
        if (state.answered) return;
        const feedback = document.getElementById('feedback');
        if (choice === answer) {
          state.answered = true;
          state.correct++;
          btn.classList.add('correct');
          allButtons.forEach(function (b) { b.disabled = true; });
          feedback.textContent = RIGHT_MESSAGES[Math.floor(Math.random() * RIGHT_MESSAGES.length)];
          setTimeout(nextQuestion, 1100);
        } else {
          btn.classList.add('wrong');
          btn.disabled = true;
          feedback.textContent = TRY_AGAIN_MESSAGES[Math.floor(Math.random() * TRY_AGAIN_MESSAGES.length)];
        }
      }

      function nextQuestion() {
        state.currentIdx++;
        if (state.currentIdx >= state.questions.length) showResults();
        else showQuestion();
      }

      function showResults() {
        clear();
        const score = state.correct;
        const total = state.questions.length;
        const ratio = score / total;
        let stars, message;
        if (ratio >= 0.9)      { stars = '⭐⭐⭐'; message = 'Amazing!'; }
        else if (ratio >= 0.7) { stars = '⭐⭐';   message = 'Great job!'; }
        else if (ratio >= 0.4) { stars = '⭐';     message = 'Good effort!'; }
        else                    { stars = '🌱';     message = 'Keep practicing!'; }

        const screen = el('div', { class: 'screen' }, [
          el('h1', null, 'You did it!'),
          el('div', { class: 'result-stars' }, stars),
          el('div', { class: 'result-message' }, message),
          el('div', { class: 'result-score' },
            'You got ' + score + ' out of ' + total + ' right!'),
          el('button', {
            class: 'btn',
            onclick: function () { startRound(state.mode); },
          }, [
            el('span', { class: 'emoji' }, '🔁'),
            el('span', null, 'Play Again'),
          ]),
          el('button', {
            class: 'btn btn-secondary',
            onclick: showStart,
          }, 'Pick a New Game'),
        ]);
        app.appendChild(screen);
      }

      showStart();
    })();
  </script>
</body>
</html>
